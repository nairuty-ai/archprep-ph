<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All ALE review courses — ArkiPrep</title>
  <meta name="description" content="Reviewers, quiz packs and full mock boards for ALE Subjects A &amp; B. Access length shown on each course." />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="config.js"></script>
  <script>
    // Motion layer (js/app/motion.js): pre-animation states apply only under
    // this class, and only when the visitor hasn't asked for reduced motion.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion-ready');
  </script>
</head>
<body>
  <div id="site-header"></div>
  <script src="js/app/chrome.js" data-active="catalog"></script>

  <main id="main">
    <div class="wrap page-pad stack gap-20" style="padding-top:32px">
      <div class="stack gap-6" data-reveal>
        <h1 class="page-title">All ALE review courses</h1>
        <p class="muted" id="result-count" aria-live="polite">Loading courses…</p>
      </div>

      <div class="chips" id="type-chips" role="group" aria-label="Course type" data-reveal>
        <button class="chip" type="button" data-type="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-type="material" aria-pressed="false">Materials</button>
        <button class="chip" type="button" data-type="quiz" aria-pressed="false">Quiz packs</button>
        <button class="chip" type="button" data-type="mock" aria-pressed="false">Full mock board</button>
        <button class="chip" type="button" data-type="free" aria-pressed="false">Free</button>
      </div>

      <div class="catalog-layout">
        <div>
          <button class="btn btn--secondary btn--sm filters-toggle" type="button" aria-expanded="false" aria-controls="filters">Filter ▾</button>
          <form class="filters" id="filters">
            <fieldset class="filter-group">
              <legend>Subject</legend>
              <label><input type="checkbox" name="subject" value="A" checked /> Subject A · History, Planning, Practice</label>
              <label><input type="checkbox" name="subject" value="B" checked /> Subject B · Structures, BT, Utilities</label>
            </fieldset>
            <fieldset class="filter-group">
              <legend>Price</legend>
              <label><input type="checkbox" name="price" value="free" /> Free</label>
              <label><input type="checkbox" name="price" value="paid" /> Paid</label>
            </fieldset>
            <fieldset class="filter-group">
              <legend>Access</legend>
              <label><input type="checkbox" name="access" value="attempts" /> 2 attempts</label>
              <label><input type="checkbox" name="access" value="exam_date" /> Until next ALE</label>
              <label><input type="checkbox" name="access" value="unlimited" /> Unlimited (free)</label>
            </fieldset>
          </form>
        </div>
        <div id="course-list" aria-busy="true" data-reveal-group></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="js/app/pages/catalog.js"></script>
</body>
</html>
