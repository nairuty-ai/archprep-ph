<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ArchPrep PH</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="config.js"></script>
</head>
<body class="admin">
  <!-- Login screen -->
  <section id="login-view">
    <div class="container">
      <div class="admin-login">
        <div class="quiz-card">
          <h1 class="mb-0">ArchPrep PH <span class="text-accent">Admin</span></h1>
          <p class="lead">Sign in to manage quizzes, products, codes, and settings.</p>
          <div id="login-alert"></div>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" autocomplete="current-password" />
            </div>
            <button class="btn btn--secondary btn--lg btn--block" type="submit" id="login-btn">Log in</button>
          </form>
          <p class="muted" style="margin-top:1rem; font-size:var(--fs-xs)">Not connected? The owner must set the Apps Script URL in config.js and run setupAdminCredential once (see SETUP.md).</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dash-view" hidden>
    <header class="admin-bar">
      <div class="container">
        <span class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21 12 3l9 18"/><path d="M7.5 21 12 12l4.5 9"/></svg>
          </span>
          <span data-brand>ArchPrep PH</span><span class="admin-tag">Admin</span>
        </span>
        <span class="who">Signed in as <strong id="who-user">—</strong> · expires in <span id="who-exp">—</span></span>
        <button class="btn btn--outline btn--sm" id="logout-btn" type="button" style="background:#fff">Log out</button>
      </div>
    </header>

    <main class="container" style="padding-top:1rem; padding-bottom:3rem">
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab" role="tab" data-tab="quizzes" aria-selected="true">Quizzes</button>
        <button class="admin-tab" role="tab" data-tab="products" aria-selected="false">Products</button>
        <button class="admin-tab" role="tab" data-tab="codes" aria-selected="false">Access Codes</button>
        <button class="admin-tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </div>

      <div class="admin-panel active" id="panel-quizzes"></div>
      <div class="admin-panel" id="panel-products"></div>
      <div class="admin-panel" id="panel-codes"></div>
      <div class="admin-panel" id="panel-settings"></div>
    </main>
  </section>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
