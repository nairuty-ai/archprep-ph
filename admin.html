<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — ArchPrep PH</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="config.js"></script>
</head>
<body class="admin">

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21 12 3l9 18"/>
            <path d="M7.5 21 12 12l4.5 9"/>
          </svg>
        </span>
        <span data-brand>ArchPrep PH</span>
      </a>
      <span style="font-size:.85rem;color:var(--muted);margin-left:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;">Admin</span>
      <div id="nav-actions" style="margin-left:auto"></div>
    </div>
  </header>

  <main id="main">

    <!-- Access denied state (shown when not admin) -->
    <div id="access-denied" hidden class="container section">
      <div style="max-width:460px;margin:3rem auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;">
        <p style="font-size:2.5rem;margin:0 0 .75rem">🔒</p>
        <p style="font-weight:700;font-size:var(--fs-md);margin:0 0 1.25rem;color:var(--ink)">Access denied. You need admin privileges to view this page.</p>
        <a href="index.html" class="btn btn--outline">Go home</a>
      </div>
    </div>

    <!-- Admin portal (shown when admin verified) -->
    <div id="admin-portal" hidden class="container">
      <div style="padding:1.5rem 0 .5rem">
        <h1 style="font-size:var(--fs-xl);margin:0">Admin Portal</h1>
      </div>

      <!-- Tab bar -->
      <div class="admin-tabs" role="tablist" aria-label="Admin sections" id="admin-tab-bar"></div>

      <!-- Tab panels -->
      <div id="admin-panel" style="padding:1.5rem 0"></div>
    </div>

  </main>

  <!-- Modal root for confirmation dialogs -->
  <div id="modal-root"></div>

  <script type="module" src="js/admin/index.js"></script>
</body>
</html>
