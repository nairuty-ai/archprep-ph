<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course — ArkiPrep</title>
  <meta name="description" content="ALE review course on ArkiPrep." />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="config.js"></script>
  <script>
    // Motion layer (js/app/motion.js): pre-animation states apply only under
    // this class, and only when the visitor hasn't asked for reduced motion.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion-ready');
  </script>
</head>
<body>
  <div id="site-header"></div>
  <script src="js/app/chrome.js" data-active="catalog"></script>

  <main id="main">
    <div id="course" aria-busy="true">
      <div class="course-hero"><div class="inner"><div class="stack gap-12">
        <div class="skeleton" style="height:18px;width:200px;opacity:.2"></div>
        <div class="skeleton" style="height:40px;width:80%;opacity:.2"></div>
        <div class="skeleton" style="height:22px;width:60%;opacity:.2"></div>
      </div></div></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="js/app/pages/product.js"></script>
</body>
</html>
